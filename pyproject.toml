[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "rdmo-plugins-radar"
authors = [
    {name = "RDMO Arbeitsgemeinschaft", email = "rdmo-team@listserv.dfn.de"},
]
maintainers = [
    {name = "Jochen Klar", email = "mail@jochenklar.de"},
]
description = "Plugins to connect RDMO with RADAR"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Web Environment',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Operating System :: OS Independent',
    "Programming Language :: Python :: 3 :: Only",
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    "rdmo",
    "xmlschema>=3.4.5,<4",
]
dynamic = ["version"]

[project.optional-dependencies]
ci = [
  "rdmo-plugins-radar[dev]",
]
dev = [
  "pre-commit~=3.5",
  "rdmo[allauth]",
  "rdmo-plugins-radar[pytest]",
]
pytest = [
  "pytest>=7,<9",
  "pytest-django>=4,<5",
]

[project.urls]
repository = "https://github.com/rdmorganiser/rdmo-plugins-radar"

[tool.setuptools.packages.find]
include = ["rdmo_radar*"]

[tool.setuptools.package-data]
rdmo_radar = [
  "schemas/*.xsd",
  "static/**/*.css",
  "templates/**/*.html",
  "xml/**/*.xml",
]

[tool.setuptools.dynamic]
version = {attr = "rdmo_radar.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "DJ",   # flake8-django
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # isort
  "PGH",  # pygrep-hooks
  "PT",   # flake8-pytest-style
  "RUF",  # ruff
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
  "G",    # flake8-logging-format
  "INT",  # flake8-gettext
]
ignore = [
  "RUF012", # mutable-class-default
]

[tool.ruff.lint.isort]
known-first-party = ["rdmo_radar"]
section-order = [
  "future",
  "standard-library",
  "pytest",
  "django",
  "rest_framework",
  "third-party",
  "rdmo",
  "first-party",
  "local-folder"
]

[tool.ruff.lint.isort.sections]
pytest = ["pytest"]
django = ["django"]
rest_framework = ["rest_framework"]
rdmo = ["rdmo"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.format]
quote-style = "single"
